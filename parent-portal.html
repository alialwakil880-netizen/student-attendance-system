<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة ولي الأمر - متابعة الطالب</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .parent-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            direction: rtl;
        }
        
        .parent-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.3);
        }
        
        .parent-header h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 5px;
        }
        
        .parent-header .sub {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .parent-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 20px;
            border: 1px solid #f0f0f0;
        }
        
        .parent-card h2 {
            color: #667eea;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 12px;
        }
        
        .parent-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .parent-info-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            border-right: 4px solid #667eea;
        }
        
        .parent-info-item .label {
            font-size: 12px;
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
            display: block;
            margin-bottom: 5px;
        }
        
        .parent-info-item .value {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a2e;
        }
        
        .parent-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin: 15px 0;
        }
        
        .parent-stat {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }
        
        .parent-stat .num {
            font-size: 28px;
            font-weight: 800;
        }
        
        .parent-stat .num.green { color: #4CAF50; }
        .parent-stat .num.red { color: #f44336; }
        .parent-stat .num.blue { color: #42a5f5; }
        .parent-stat .num.gold { color: #f9a825; }
        .parent-stat .num.purple { color: #667eea; }
        
        .parent-stat .lbl {
            font-size: 12px;
            color: #888;
            font-weight: 600;
        }
        
        .parent-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        
        .parent-table th {
            background: #f8f9fa;
            padding: 12px;
            text-align: right;
            font-weight: 700;
            color: #555;
            font-size: 13px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .parent-table td {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            color: #333;
        }
        
        .parent-table tr:hover td {
            background: #fafafa;
        }
        
        .parent-medals {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 28px;
        }
        
        .parent-level-badge {
            display: inline-block;
            padding: 6px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 16px;
        }
        
        .parent-level-excellent { background: #f9a825; color: #000; }
        .parent-level-very-good { background: #4CAF50; color: #fff; }
        .parent-level-good { background: #42a5f5; color: #fff; }
        .parent-level-acceptable { background: #ff9800; color: #fff; }
        .parent-level-weak { background: #f44336; color: #fff; }
        
        .parent-footer {
            text-align: center;
            padding: 30px;
            color: #888;
            font-size: 14px;
            border-top: 1px solid #f0f0f0;
            margin-top: 20px;
        }
        
        .parent-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .parent-footer a:hover {
            text-decoration: underline;
        }
        
        .parent-back-btn {
            display: inline-block;
            padding: 10px 30px;
            background: #667eea;
            color: white;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        .parent-back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }
        
        .parent-qr-code {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }
        
        .parent-qr-code canvas {
            border: 3px solid #667eea;
            border-radius: 12px;
            padding: 8px;
            background: white;
        }
        
        .parent-not-found {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        
        .parent-not-found h2 {
            font-size: 28px;
            color: #f44336;
            margin-bottom: 10px;
        }
        
        .parent-not-found p {
            color: #888;
            font-size: 16px;
        }
        
        .parent-warning {
            background: #fff3cd;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            border: 1px solid #ffc107;
            margin-top: 20px;
        }
        
        .parent-warning p {
            color: #856404;
            margin: 0;
            font-weight: 600;
        }
        
        .parent-loading {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        
        .parent-loading .spinner {
            font-size: 48px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* ============================================
           إخفاء كل الأزرار والعناصر الإضافية
           ============================================ */
        
        .parent-container .sidebar,
        .parent-container .header,
        .parent-container .dashboard-container,
        .parent-container .main-content,
        .parent-container .bottom-bar,
        .parent-container .action-buttons,
        .parent-container .search-section,
        .parent-container .btn-primary:not(.parent-back-btn),
        .parent-container .btn-secondary,
        .parent-container .btn-danger,
        .parent-container button:not(.parent-back-btn) {
            display: none !important;
        }
        
        .parent-container .floating,
        .parent-container .fixed-bottom,
        .parent-container .navbar,
        .parent-container .menu {
            display: none !important;
        }
        
        .parent-container table button,
        .parent-container table .btn-primary,
        .parent-container table .btn-danger {
            display: none !important;
        }
        
        .parent-container .footer-actions,
        .parent-container .footer-buttons {
            display: none !important;
        }
        
        .parent-container button:hover {
            transform: none !important;
            box-shadow: none !important;
        }
        
        @media print {
            .parent-back-btn { display: none; }
            .parent-header { background: #667eea !important; -webkit-text-fill-color: white !important; }
            .parent-card { box-shadow: none !important; border: 1px solid #ddd !important; }
        }
        
        @media (max-width: 600px) {
            .parent-info-grid { grid-template-columns: 1fr; }
            .parent-stats { grid-template-columns: repeat(2, 1fr); }
            .parent-header h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="page-transition">
        <div class="parent-container">
            <div class="parent-header">
                <h1>📚 بوابة ولي الأمر</h1>
                <p class="sub">👨‍👦 متابعة أداء الطالب - عرض فقط</p>
            </div>

            <div id="parentContent">
                <div class="parent-loading">
                    <div class="spinner">⏳</div>
                    <h3>جاري تحميل بيانات الطالب...</h3>
                    <p style="color:#888;">يرجى الانتظار</p>
                </div>
            </div>

            <div class="parent-footer">
                <p>© 2024 نظام متابعة الطلاب - بوابة ولي الأمر</p>
                <p style="font-size:12px;margin-top:5px;">هذه الصفحة للعرض فقط، لا توجد صلاحيات تعديل</p>
                <a href="index.html" class="parent-back-btn">🔙 العودة لتسجيل الدخول</a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            await initSupabaseClient();
            await loadData();
            loadParentData();
        });
    </script>
</body>
</html>
